const FRAMEWORK="# 计算机科学与数学知识地图（中文）\n\n本图覆盖所给清单的全部显式科目，并扩充主干缺口。它是适合学习规划的知识地图，不宣称穷尽数学、计算机或所有行业的研究子领域。\n\n## 阅读规则\n\n- **归属编码**：如 `M.1.4.2` 是“数学 → 分析与微积分 → 多元微积分 → 梯度与雅可比矩阵”。点号层数仅表示包含层级；一级大类、二级分支、三级主题，必要时细到四级。\n- **深度编码**：D1 核心基础；D2 工程实践；D3 专业深入；D4 高级理论与科研专题。D编码不决定所属领域，也不是难度排行榜；同一科目可跨多个深度。\n- **包含**：父节点组织子内容。为了去重，每项选择一个主要归属；相交领域用关联边保留多个视角。标题为组织性分组时，不声称其中各学科存在唯一严格的数学集合包含关系。\n- **前置**：`A → B` 表示本图建议的主要概念或学习前置，附有理由；不是所有路线的硬性先修，也不是全部依赖的穷尽图。基础可并行、交错推进。\n- **关联**：`A ↔ B` 表示方法共享、范围交叠或跨领域应用，不表示两个主题相同。\n- **可选应用方向**：X域包含原清单中的行业与前沿项目；通用学习路径中可按目标后置，不表示该领域简单或价值低。没有另设“第五层”。\n\n## 四层学习深度与验收\n\n| 编码 | 名称 | 典型验收 |\n|---|---|---|\n| D1 | 核心基础 | 解释基本概念，掌握表示与基础推理，完成小规模手算或程序。 |\n| D2 | 工程实践 | 实现、使用与测试方法，在明确约束下完成可运行、可验证的任务。 |\n| D3 | 专业深入 | 推导与分析机制，比较方法和适用假设，理解复杂性、稳定性或质量权衡。 |\n| D4 | 高级理论与科研专题 | 阅读论文、严谨证明或复现实验，研究假设、边界、失效模式与开放问题。 |\n\n例如线性代数在D1学空间与线性方程，在D2实现最小二乘，在D3解释分解与谱结构；D4的矩阵研究仍留在代数领域。教育科技即使按通用路径后置，也可在D4研究学习干预的因果效果。\n\n## 易读总框架\n\n### M　数学基础与方法\n\n研究数量、结构、空间、变化与不确定性；为理论计算、工程建模和科学计算提供语言。\n\n- **M.1 分析与微积分**：极限与连续；一元微分学；一元积分学；多元微积分；无穷级数；实分析；泛函分析；复分析；傅里叶分析与调和分析\n- **M.2 微分方程与动力系统**：常微分方程；偏微分方程；动力系统与混沌；变分法与最优控制数学\n- **M.3 线性结构、代数与数论**：线性代数；矩阵理论与矩阵分析；张量代数与多重线性代数；代数结构与抽象代数；数论；代数几何与表示论专题\n- **M.4 几何与拓扑**：向量代数与解析几何；微分几何；拓扑学；计算几何与几何处理；拓扑数据分析与几何学习数学\n- **M.5 离散数学与逻辑基础**：集合论；数理逻辑；证明方法与离散结构；组合数学；图论\n- **M.6 概率、统计与信息**：概率论；数理统计；随机过程；时间序列与排队论；信息论与编码理论\n- **M.7 优化与运筹**：优化建模与运筹基础；凸优化；非凸优化；随机优化；离散与组合优化；博弈论与决策理论\n- **M.8 计算数学与数值分析**：误差、稳定性与数值线性代数；插值、逼近与数值积分；微分方程数值解与科学计算；蒙特卡洛方法；自动微分与计算图；符号计算与计算代数\n\n### F　理论计算机科学\n\n研究可计算性、算法效率、程序的形式意义与正确性。\n\n- **F.1 数据结构与算法**：数据结构；算法分析与设计；图算法与字符串算法；随机、近似与在线算法；并行、外存与流算法；参数化、次线性与精细复杂度算法\n- **F.2 自动机、计算与复杂性**：形式语言与自动机；可计算性理论；计算复杂性理论；计算逻辑与自动定理证明\n- **F.3 程序语言理论与形式化方法**：计算范式与λ演算；类型系统与程序语义；程序验证与模型检查；证明助手与形式化数学\n\n### P　程序设计与软件工程\n\n从表达计算到构造、交付、维护可靠软件；语言、平台与工程过程分开组织。\n\n- **P.1 程序设计基础与范式**：程序设计基础；面向对象程序设计；函数式、逻辑式与声明式编程；高级程序设计\n- **P.2 程序语言与开发工具**：Java程序设计；C/C++与底层编程；Python与科学计算工具；版本控制、调试与构建工具\n- **P.3 编译器与运行时**：编译原理；运行时、虚拟机与内存管理\n- **P.4 软件工程与软件架构**：软件工程基础与开发方法；需求工程与领域建模；软件设计与面向对象分析设计；软件架构；软件测试、质量与可靠性；软件维护、演化与技术债\n- **P.5 应用开发与软件交付**：互联网与Web开发；移动、桌面与跨平台开发；DevOps、持续交付与SRE；软件供应链与可复现构建\n\n### C　计算机系统与网络\n\n从指令执行、操作系统、网络通信到分布式与高性能计算。\n\n- **C.1 计算机组成与体系结构**：计算机组成原理；计算机体系结构；ARM与其他指令集体系；GPU、加速器与异构系统\n- **C.2 操作系统与系统软件**：操作系统；系统编程与并发同步；虚拟化、容器与资源管理；存储系统与文件系统\n- **C.3 数据通信与计算机网络**：数据通信与信号基础；网络协议、路由与传输；无线、移动与物联网网络；网络管理、SDN与可编程网络\n- **C.4 分布式系统与云计算**：分布式系统；云计算；分布式算法与一致性理论；消息、事件与流处理系统\n- **C.5 并行计算与高性能计算**：共享/分布式内存并行编程；GPU计算与性能优化；高性能科学计算\n\n### D　数据管理与数据科学\n\n组织、保存、处理和解释数据；数据科学同时依赖数学、AI和可视化。\n\n- **D.1 数据库系统与数据管理**：数据建模、关系模型与SQL；数据库内核与查询优化；分布式数据库与NoSQL；数据库管理与安全；数据治理、元数据与质量\n- **D.2 数据工程与大数据**：ETL/ELT与数据管线；大数据管理与处理；搜索、信息检索与推荐基础设施\n- **D.3 数据科学、统计分析与挖掘**：数据科学导论与工具箱；知识发现与数据挖掘；评估、实验与可复现分析\n- **D.4 知识与信息工程**：知识表示、知识图谱与本体；知识推理与语义计算\n\n### A　人工智能与机器学习\n\n研究智能行为的表示、推理、学习、感知和决策；机器学习是AI的重要子领域。\n\n- **A.1 人工智能基础与智能系统**：搜索、规划与约束求解；概率图模型与不确定推理\n- **A.2 机器学习**：监督、无监督与半监督学习；学习理论与泛化；深度学习；强化学习；迁移、多任务与联邦学习\n- **A.3 感知、语言与内容生成**：自然语言处理；图像处理与计算机视觉；语音与音频智能；推荐系统；生成式AI\n- **A.4 AI工程、可靠性与科研**：机器学习工程与MLOps；可信AI、可解释性与公平性；AI安全与模型系统安全；多智能体、因果与神经符号专题\n\n### S　网络空间安全\n\n从威胁建模、密码学到系统/网络/应用防护、检测响应与安全研究；各安全课程按对象去重。\n\n- **S.1 安全基础与密码学**：安全原理、威胁建模与风险；密码学；现代密码与隐私计算专题\n- **S.2 系统、网络与平台安全**：计算机系统安全；网络安全；无线与移动安全；云安全与容器安全；硬件、嵌入式与物联网安全\n- **S.3 软件、应用与数据安全**：应用、Web与API安全；安全软件开发与程序分析；数据安全、隐私工程与访问控制\n- **S.4 安全测试、取证与响应**：渗透测试、道德黑客与反制；计算机取证与事件响应；逆向工程与恶意软件分析；安全运营、检测与攻防评估\n- **S.5 安全理论与研究**：协议验证与信息流安全；系统安全研究与安全测量\n\n### H　电子硬件、嵌入式与控制\n\n从电路与逻辑到芯片、设备软件、感知控制与物理世界接口。\n\n- **H.1 电子与数字逻辑基础**：电路与模拟电子基础；数字电路与数字逻辑；信号与系统、数字信号处理\n- **H.2 硬件设计与集成电路**：FPGA与Verilog/HDL；EDA与硬件验证；PCB设计与板级工程；VLSI与芯片设计；半导体器件与微电子基础\n- **H.3 嵌入式系统与设备接口**：单片机与微控制器；嵌入式系统、驱动与RTOS；传感器与接口；实时系统与安全关键系统\n- **H.4 控制、机器人与物联网**：控制理论与状态估计；机器人建模、规划与控制；物联网；边缘计算\n\n### V　图形、多媒体与人机交互\n\n生成与呈现视觉/媒体内容，研究人与计算系统的交互；计算机视觉主要归AI。\n\n- **V.1 计算机图形学与媒体计算**：计算机图形学；多媒体技术；渲染、仿真与可微图形专题\n- **V.2 人机交互与用户体验**：交互基础与认知、人因；用户研究、交互设计与UX评估；可访问性与包容性设计；XR、空间交互与协作系统\n- **V.3 数据可视化与可视分析**：数据可视化与交互设计；科学可视化与可视分析\n\n### I　信息系统、组织与专业实践\n\n研究技术与组织、业务、人的协作，以及伦理、项目治理和科研实践。\n\n- **I.1 信息系统与业务**：信息系统基础；信息系统战略与管理；业务流程管理；信息技术项目管理\n- **I.2 专业伦理、治理与科研方法**：计算伦理、社会影响与专业责任；技术写作、协作与文献阅读；研究设计、可复现性与学术规范\n\n### X　交叉应用与前沿专题\n\n按目标组合主干领域；多数为应用方向或科研专题，不是所有人都应先学的公共基础。\n\n- **X.1 智能设备与自主系统**：嵌入式AI；边缘AI；自动驾驶与自主系统\n- **X.2 科学与行业计算**：生物信息与计算生物学；金融科技与计算金融；教育科技与学习科学计算；医疗健康信息学；地理空间、气候与数字人文计算\n- **X.3 新型计算与可信协作**：量子计算与量子信息；区块链与分布式账本；科学机器学习与可微仿真\n\n## 完整分层目录\n\n每行的D标记表示此图展开的学习阶段；父节点的深度表示其分支范围，非要求每个子项均学到同一深度。\n\n### M　数学基础与方法\n\n- **M.1 分析与微积分**〔D1 / D2 / D3 / D4〕：从极限与微积分到实分析、复分析与泛函分析。多元微积分包含多元微分和多重、曲线、曲面积分。\n  - **M.1.1 极限与连续**〔D1 / D3〕：数列与函数极限、无穷小、连续性、紧致区间上的基本性质。\n  - **M.1.2 一元微分学**〔D1 / D2 / D3〕：导数、微分、微分中值定理、泰勒公式与局部近似。\n  - **M.1.3 一元积分学**〔D1 / D2 / D3〕：不定积分、定积分、微积分基本定理与反常积分。\n  - **M.1.4 多元微积分**〔D1 / D2 / D3〕：多元函数的微分与积分总称；子项保留独立定位，避免与多元微分学混为一谈。\n    - **M.1.4.1 多元微分学**〔D1 / D2 / D3〕：偏导数、全微分、方向导数、隐函数与逆函数定理。\n    - **M.1.4.2 梯度与雅可比矩阵**〔D1 / D2 / D3〕：标量场梯度、向量映射导数、链式法则与坐标变换；属于多元微分工具。\n    - **M.1.4.3 海森矩阵**〔D1 / D2 / D3〕：二阶偏导矩阵、二阶近似与极值判别；连接二阶优化。\n    - **M.1.4.4 重积分**〔D1 / D2 / D3〕：二重、三重积分，区域分割、换元与雅可比行列式。\n    - **M.1.4.5 曲线曲面积分与向量分析**〔D1 / D2 / D3〕：曲线与曲面积分、梯度/散度/旋度、Green/Gauss/Stokes定理。（合并名/别名：曲线曲面积分）\n  - **M.1.5 无穷级数**〔D1 / D3〕：数项级数、函数项级数、幂级数、一致收敛与逐项运算。\n  - **M.1.6 实分析**〔D3 / D4〕：实数完备性、函数序列、收敛交换与积分理论；为现代分析提供严谨基础。\n    - **M.1.6.1 测度论与Lebesgue积分**〔D3 / D4〕：σ代数、测度、可测函数、收敛定理、乘积测度。（合并名/别名：测度论）\n  - **M.1.7 泛函分析**〔D3 / D4〕：赋范空间、Banach/Hilbert空间、线性算子、对偶与谱理论。\n  - **M.1.8 复分析**〔D3 / D4〕：解析函数、Cauchy理论、留数与保角映射。\n  - **M.1.9 傅里叶分析与调和分析**〔D2 / D3 / D4〕：傅里叶级数/变换、小波、频域表示、函数空间与调和分析专题。\n- **M.2 微分方程与动力系统**〔D2 / D3 / D4〕：连续时间模型、初边值问题、稳定性与系统演化。\n  - **M.2.1 常微分方程**〔D2 / D3 / D4〕：一阶与高阶方程、线性方程组、存在唯一性、稳定性与数值求解。\n  - **M.2.2 偏微分方程**〔D2 / D3 / D4〕：椭圆/抛物/双曲型方程、边界条件、弱解与适定性。\n  - **M.2.3 动力系统与混沌**〔D3 / D4〕：相空间、平衡点、分岔、吸引子与混沌。\n  - **M.2.4 变分法与最优控制数学**〔D3 / D4〕：泛函极值、Euler–Lagrange方程、变分原理与最优性条件。\n- **M.3 线性结构、代数与数论**〔D1 / D2 / D3 / D4〕：线性与多重线性结构、抽象代数和整数结构；矩阵研究与线性代数高度交叠。\n  - **M.3.1 线性代数**〔D1 / D2 / D3〕：向量空间、线性映射、线性方程组、矩阵、特征值、内积与正交分解。（合并名/别名：线代）\n  - **M.3.2 矩阵理论与矩阵分析**〔D2 / D3 / D4〕：矩阵范数、谱与奇异值分解、正定性、扰动、矩阵函数与不等式；合并两门高度重叠课程名称。（合并名/别名：矩阵论、矩阵分析）\n  - **M.3.3 张量代数与多重线性代数**〔D2 / D3 / D4〕：张量积、缩并、坐标变换与张量分解；AI中的多维数组不等同于全部张量理论。（合并名/别名：张量代数）\n  - **M.3.4 代数结构与抽象代数**〔D1 / D3 / D4〕：群、环、域、同态、商结构与有限域；高阶可进入表示论。（合并名/别名：代数结构）\n  - **M.3.5 数论**〔D1 / D3 / D4〕：整除与同余、素数、数论算法、代数数论与解析数论专题。\n  - **M.3.6 代数几何与表示论专题**〔D4〕：多项式理想、代数簇、群表示与结构方法；按研究目标选学。\n- **M.4 几何与拓扑**〔D1 / D2 / D3 / D4〕：欧氏空间、曲率与流形、连续变形与拓扑不变量。\n  - **M.4.1 向量代数与解析几何**〔D1 / D2 / D3〕：坐标、向量运算、直线/平面、二次曲线/曲面；与线性代数共享向量工具。\n  - **M.4.2 微分几何**〔D3 / D4〕：曲线曲面、流形、切空间、度量、联络与曲率。\n  - **M.4.3 拓扑学**〔D3 / D4〕：拓扑空间、连续性、紧致性、连通性、基本群与同调初步。\n  - **M.4.4 计算几何与几何处理**〔D2 / D3 / D4〕：凸包、空间划分、网格、曲面处理与几何算法。\n  - **M.4.5 拓扑数据分析与几何学习数学**〔D3 / D4〕：持续同调、流形方法、几何结构与数据表征；与AI共享应用。\n- **M.5 离散数学与逻辑基础**〔D1 / D2 / D3 / D4〕：以离散结构为教学主线组织集合、逻辑、组合与图；这些分支各自也有独立理论。\n  - **M.5.1 集合论**〔D1 / D3 / D4〕：集合运算、关系、映射、基数、序数与公理集合论。\n  - **M.5.2 数理逻辑**〔D1 / D3 / D4〕：命题与谓词逻辑、推理、形式系统、模型论与证明论基础。\n  - **M.5.3 证明方法与离散结构**〔D1 / D2 / D3〕：归纳、反证、不变式、等价关系、偏序、递推与结构化证明。（合并名/别名：离散数学）\n  - **M.5.4 组合数学**〔D1 / D3 / D4〕：计数、容斥、生成函数、组合设计、极值与概率方法。\n  - **M.5.5 图论**〔D1 / D2 / D3 / D4〕：图、树、连通性、匹配、着色、网络流与谱图理论。\n- **M.6 概率、统计与信息**〔D1 / D2 / D3 / D4〕：不确定性建模、统计推断、随机过程与信息度量；统计计算另见计算数学。\n  - **M.6.1 概率论**〔D1 / D2 / D3 / D4〕：概率空间、随机变量、分布、条件概率、期望与极限定理；测度化表述属于深入层。\n  - **M.6.2 数理统计**〔D1 / D2 / D3 / D4〕：抽样分布、估计、检验、似然、置信区间、渐近理论与决策。\n    - **M.6.2.1 贝叶斯统计**〔D2 / D3 / D4〕：先验/似然/后验、层级模型、后验计算与模型比较。\n    - **M.6.2.2 回归与统计建模**〔D1 / D2 / D3〕：线性/广义线性模型、正则化、残差诊断与不确定性。\n    - **M.6.2.3 实验设计与因果推断**〔D2 / D3 / D4〕：随机实验、混杂、潜在结果、因果图、识别与估计。\n    - **M.6.2.4 高维统计与统计学习理论**〔D3 / D4〕：集中不等式、稀疏性、一致性、风险界与高维估计。\n  - **M.6.3 随机过程**〔D2 / D3 / D4〕：随机序列与随机函数、平稳性、鞅、Poisson过程与Brown运动。\n    - **M.6.3.1 马尔可夫链**〔D2 / D3 / D4〕：离散/连续时间链、转移、平稳分布、混合与遍历性。\n    - **M.6.3.2 随机微积分与随机微分方程**〔D4〕：滤过、Itô积分、随机微分方程；适用于部分金融与科学建模路线。\n  - **M.6.4 时间序列与排队论**〔D2 / D3 / D4〕：自相关、预测、状态空间、到达/服务过程与系统性能。\n  - **M.6.5 信息论与编码理论**〔D1 / D3 / D4〕：熵、互信息、KL散度、信源/信道编码、容量与率失真。（合并名/别名：信息论）\n- **M.7 优化与运筹**〔D1 / D2 / D3 / D4〕：以目标函数、约束和算法分析组织优化问题；与统计、控制和算法理论交叉。\n  - **M.7.1 优化建模与运筹基础**〔D1 / D2 / D3〕：目标与约束、线性规划、对偶、灵敏度、网络优化与资源配置。\n  - **M.7.2 凸优化**〔D2 / D3 / D4〕：凸集/凸函数、对偶、KKT条件、近端与内点方法。\n  - **M.7.3 非凸优化**〔D2 / D3 / D4〕：局部与全局最优、鞍点、非凸约束、全局方法与复杂性。\n  - **M.7.4 随机优化**〔D2 / D3 / D4〕：随机梯度、随机逼近、方差缩减、随机规划与收敛分析。\n  - **M.7.5 离散与组合优化**〔D2 / D3 / D4〕：整数规划、分支定界、组合结构、近似与启发式方法。\n  - **M.7.6 博弈论与决策理论**〔D3 / D4〕：均衡、机制设计、效用、序贯决策与多主体相互作用。\n- **M.8 计算数学与数值分析**〔D2 / D3 / D4〕：计算数学包含数值分析、随机计算与符号计算；数值分析不与计算数学完全等同。（合并名/别名：计算数学、数值分析）\n  - **M.8.1 误差、稳定性与数值线性代数**〔D2 / D3 / D4〕：浮点数、条件数、后向稳定性、直接/迭代线性求解与特征值计算。\n  - **M.8.2 插值、逼近与数值积分**〔D2 / D3 / D4〕：多项式/样条逼近、误差估计、求积与自适应方法。\n  - **M.8.3 微分方程数值解与科学计算**〔D2 / D3 / D4〕：时间步进、有限差分/有限元/有限体积、收敛与多物理仿真。\n  - **M.8.4 蒙特卡洛方法**〔D2 / D3 / D4〕：随机抽样、方差缩减、重要性抽样、MCMC与误差评估；与贝叶斯统计交叉。\n  - **M.8.5 自动微分与计算图**〔D2 / D3 / D4〕：前向/反向模式、向量–雅可比乘积、可微程序与梯度验证。\n  - **M.8.6 符号计算与计算代数**〔D2 / D3 / D4〕：表达式化简、精确运算、多项式算法与计算机代数系统。\n### F　理论计算机科学\n\n- **F.1 数据结构与算法**〔D1 / D2 / D3 / D4〕：从数据组织、算法设计到正确性、复杂度和专项算法；工程实现依赖程序设计。\n  - **F.1.1 数据结构**〔D1 / D2 / D3〕：数组、链表、栈队列、哈希、树、堆、图存储与不变量。\n  - **F.1.2 算法分析与设计**〔D1 / D2 / D3〕：渐近分析、递归、分治、贪心、动态规划与摊还分析。（合并名/别名：数据结构与算法）\n  - **F.1.3 图算法与字符串算法**〔D2 / D3 / D4〕：遍历、最短路、流、匹配、字符串匹配、索引与自动机方法。\n  - **F.1.4 随机、近似与在线算法**〔D3 / D4〕：随机化保证、近似比、竞争分析与下界。\n  - **F.1.5 并行、外存与流算法**〔D3 / D4〕：工作量/跨度、通信与I/O复杂度、草图和流式摘要。\n  - **F.1.6 参数化、次线性与精细复杂度算法**〔D4〕：固定参数可解性、性质测试与条件性复杂度界。\n- **F.2 自动机、计算与复杂性**〔D1 / D3 / D4〕：形式语言、计算模型、可判定性与资源下界。\n  - **F.2.1 形式语言与自动机**〔D1 / D3〕：正则/上下文无关语言、有限/下推自动机、文法与形式语言层级。\n  - **F.2.2 可计算性理论**〔D3 / D4〕：Turing机、可判定与不可判定问题、归约与递归理论。\n  - **F.2.3 计算复杂性理论**〔D3 / D4〕：P/NP、完备性、空间/随机复杂度、线路复杂度与下界。\n  - **F.2.4 计算逻辑与自动定理证明**〔D3 / D4〕：可满足性、SAT/SMT、归结、证明搜索与可检查证明。\n- **F.3 程序语言理论与形式化方法**〔D2 / D3 / D4〕：语义、类型、程序逻辑和机械化证明。（合并名/别名：程序语言理论）\n  - **F.3.1 计算范式与λ演算**〔D2 / D3 / D4〕：函数式/逻辑式计算、替换、求值策略与计算模型。\n  - **F.3.2 类型系统与程序语义**〔D3 / D4〕：操作/指称/公理语义、类型安全、子类型与依赖类型。\n  - **F.3.3 程序验证与模型检查**〔D2 / D3 / D4〕：契约、Hoare逻辑、不变式、抽象解释、时序逻辑与状态空间。\n  - **F.3.4 证明助手与形式化数学**〔D3 / D4〕：命题即类型、机器检查证明、精化与可信计算基。\n### P　程序设计与软件工程\n\n- **P.1 程序设计基础与范式**〔D1 / D2 / D3〕：控制、数据、抽象、错误处理、测试与多种编程范式。\n  - **P.1.1 程序设计基础**〔D1 / D2〕：变量、控制流、函数、模块、基本数据类型、输入输出与调试。\n  - **P.1.2 面向对象程序设计**〔D1 / D2 / D3〕：对象、封装、继承、接口、组合、泛型与对象协作。\n  - **P.1.3 函数式、逻辑式与声明式编程**〔D2 / D3〕：不可变数据、高阶函数、模式匹配、规则与查询式表达。\n  - **P.1.4 高级程序设计**〔D2 / D3〕：资源管理、泛型元编程、异步/并发、性能剖析与工程化抽象。\n- **P.2 程序语言与开发工具**〔D1 / D2 / D3〕：语言是承载知识的工具；列举代表路线，不构成所有语言的穷尽清单。\n  - **P.2.1 Java程序设计**〔D1 / D2〕：类型、类与接口、集合、异常、I/O、并发基础与构建工具。\n  - **P.2.2 C/C++与底层编程**〔D1 / D2 / D3〕：内存布局、指针、生命周期、链接与系统接口。\n  - **P.2.3 Python与科学计算工具**〔D1 / D2〕：脚本、数组与数据框、科学计算、环境管理与自动化。\n  - **P.2.4 版本控制、调试与构建工具**〔D1 / D2〕：Git、调试器、构建、包管理、依赖与自动化工作流。\n- **P.3 编译器与运行时**〔D2 / D3 / D4〕：把源程序转换为可执行行为；编译与解释共享前端和运行时概念。\n  - **P.3.1 编译原理**〔D2 / D3 / D4〕：词法/语法分析、语义分析、中间表示、代码生成与编译优化。\n  - **P.3.2 运行时、虚拟机与内存管理**〔D2 / D3 / D4〕：解释执行、JIT、GC、栈与堆、FFI和运行时性能。\n- **P.4 软件工程与软件架构**〔D1 / D2 / D3 / D4〕：组织需求、设计、实现、验证和演化；软件设计与架构具有连续边界。\n  - **P.4.1 软件工程基础与开发方法**〔D1 / D2 / D3〕：生命周期、迭代/敏捷、工程原则、协作与方法选择。（合并名/别名：软件工程原理、软件工程实践与原则、软件开发方法学）\n  - **P.4.2 需求工程与领域建模**〔D2 / D3〕：需求获取、用例、约束、验收标准、领域模型与可追踪性。\n  - **P.4.3 软件设计与面向对象分析设计**〔D2 / D3〕：职责分配、UML、接口、设计原则、模式与重构。（合并名/别名：软件设计、面向对象系统分析与设计）\n  - **P.4.4 软件架构**〔D2 / D3 / D4〕：组件与边界、架构风格、质量属性、架构决策和系统演化。\n  - **P.4.5 软件测试、质量与可靠性**〔D2 / D3 / D4〕：单元/集成/系统测试、性质测试、覆盖率、故障注入与质量评估。\n  - **P.4.6 软件维护、演化与技术债**〔D2 / D3 / D4〕：可维护性、兼容性、迁移、代码理解、技术债与经验研究。\n- **P.5 应用开发与软件交付**〔D2 / D3 / D4〕：面向平台实现产品与持续交付，连接系统与软件工程。\n  - **P.5.1 互联网与Web开发**〔D2 / D3〕：HTTP应用、前后端、API、浏览器、服务端、认证集成与可访问性。\n  - **P.5.2 移动、桌面与跨平台开发**〔D2 / D3〕：平台生命周期、界面状态、设备能力、离线同步与发布。\n  - **P.5.3 DevOps、持续交付与SRE**〔D2 / D3 / D4〕：CI/CD、配置、可观测性、SLO、发布策略、故障恢复与容量。\n  - **P.5.4 软件供应链与可复现构建**〔D2 / D3 / D4〕：制品、依赖锁定、构建溯源、软件物料与供应链完整性。\n### C　计算机系统与网络\n\n- **C.1 计算机组成与体系结构**〔D1 / D2 / D3 / D4〕：组成关注部件如何实现，体系结构关注程序可见抽象与设计权衡；两者相交。\n  - **C.1.1 计算机组成原理**〔D1 / D2 / D3〕：数据表示、运算器、数据通路、控制器、存储和I/O组织。\n  - **C.1.2 计算机体系结构**〔D1 / D2 / D3 / D4〕：指令集、流水线、缓存、多核一致性、分支预测和性能模型。\n  - **C.1.3 ARM与其他指令集体系**〔D2 / D3〕：ARM指令集/异常级、RISC思想、ABI与汇编；其他ISA可作比较。（合并名/别名：ARM体系结构）\n  - **C.1.4 GPU、加速器与异构系统**〔D2 / D3 / D4〕：SIMD/SIMT、存储层次、吞吐计算、专用加速器和异构调度。\n- **C.2 操作系统与系统软件**〔D1 / D2 / D3 / D4〕：管理计算资源与隔离边界；系统原理也支撑安全和云平台。\n  - **C.2.1 操作系统**〔D1 / D2 / D3 / D4〕：进程/线程、调度、虚拟内存、文件系统、I/O、同步与隔离。\n  - **C.2.2 系统编程与并发同步**〔D2 / D3 / D4〕：系统调用、锁、原子操作、内存模型、IPC与竞态检测。\n  - **C.2.3 虚拟化、容器与资源管理**〔D2 / D3 / D4〕：虚拟机、容器隔离、资源控制、调度和镜像运行。\n  - **C.2.4 存储系统与文件系统**〔D2 / D3 / D4〕：块设备、日志、崩溃一致性、缓存、分布式存储接口与可靠性。\n- **C.3 数据通信与计算机网络**〔D1 / D2 / D3 / D4〕：信号传递、分层协议、交换路由与网络化应用。（合并名/别名：数据通信与网络）\n  - **C.3.1 数据通信与信号基础**〔D1 / D2 / D3〕：采样、调制、编码、复用、链路与误码；与电子和信息论相交。\n  - **C.3.2 网络协议、路由与传输**〔D1 / D2 / D3〕：链路/IP/TCP/UDP、路由、拥塞控制、名称系统与应用协议。\n  - **C.3.3 无线、移动与物联网网络**〔D2 / D3 / D4〕：无线介质、移动性、蜂窝/局域/低功耗通信与设备网络。\n  - **C.3.4 网络管理、SDN与可编程网络**〔D2 / D3 / D4〕：控制/数据平面、网络测量、配置、可编程转发与自动化。\n- **C.4 分布式系统与云计算**〔D2 / D3 / D4〕：跨节点协作、故障、通信和资源服务；云是分布式技术的重要工程形态。\n  - **C.4.1 分布式系统**〔D2 / D3 / D4〕：时钟、复制、一致性、共识、事务、容错与分布式调试。\n  - **C.4.2 云计算**〔D2 / D3 / D4〕：IaaS/PaaS、弹性、多租户、编排、无服务器与成本模型。\n  - **C.4.3 分布式算法与一致性理论**〔D3 / D4〕：故障模型、线性化、共识可解性、可用性与通信复杂度。\n  - **C.4.4 消息、事件与流处理系统**〔D2 / D3 / D4〕：消息语义、事件时间、状态、重放、背压与端到端保证。\n- **C.5 并行计算与高性能计算**〔D2 / D3 / D4〕：在多核、GPU与集群上组织计算，关注性能、通信和可扩展性。（合并名/别名：并行计算）\n  - **C.5.1 共享/分布式内存并行编程**〔D2 / D3 / D4〕：线程任务、向量化、消息传递、负载均衡与数据划分。\n  - **C.5.2 GPU计算与性能优化**〔D2 / D3 / D4〕：核函数、访存、同步、算子融合、带宽与性能剖析。\n  - **C.5.3 高性能科学计算**〔D2 / D3 / D4〕：数值工作负载、并行求解器、可扩展性、通信优化与能耗。\n### D　数据管理与数据科学\n\n- **D.1 数据库系统与数据管理**〔D1 / D2 / D3 / D4〕：数据模型、查询、事务、存储与治理。（合并名/别名：数据库系统）\n  - **D.1.1 数据建模、关系模型与SQL**〔D1 / D2 / D3〕：实体关系、关系代数、约束、规范化、查询与数据建模。\n  - **D.1.2 数据库内核与查询优化**〔D2 / D3 / D4〕：索引、执行计划、代价模型、并发控制、日志与恢复。\n  - **D.1.3 分布式数据库与NoSQL**〔D2 / D3 / D4〕：分片、复制、分布式事务、键值/文档/列族/图数据模型。\n  - **D.1.4 数据库管理与安全**〔D2 / D3〕：备份恢复、授权、审计、加密、监控与数据库运维；安全理论见安全领域。\n  - **D.1.5 数据治理、元数据与质量**〔D2 / D3 / D4〕：血缘、目录、模式演化、质量规则、责任与数据生命周期。\n- **D.2 数据工程与大数据**〔D2 / D3 / D4〕：批流管线、数据平台和大规模数据管理。\n  - **D.2.1 ETL/ELT与数据管线**〔D2 / D3〕：采集、清洗、转换、调度、幂等、数据验证与管线可靠性。\n  - **D.2.2 大数据管理与处理**〔D2 / D3 / D4〕：分布式数据处理、存储布局、数据湖/仓、批流一体与资源权衡。（合并名/别名：大数据管理）\n  - **D.2.3 搜索、信息检索与推荐基础设施**〔D2 / D3 / D4〕：倒排索引、排序、向量检索、检索评估与在线服务。\n- **D.3 数据科学、统计分析与挖掘**〔D1 / D2 / D3 / D4〕：把问题定义、数据、分析、评估与沟通连接成可复核的过程。\n  - **D.3.1 数据科学导论与工具箱**〔D1 / D2〕：问题定义、数据获取、清洗、探索分析、Notebook、统计包与工作流。（合并名/别名：数据科学导论、数据科学工具箱）\n  - **D.3.2 知识发现与数据挖掘**〔D2 / D3 / D4〕：关联、聚类、异常、模式挖掘、数据选择与发现过程。\n  - **D.3.3 评估、实验与可复现分析**〔D2 / D3 / D4〕：抽样偏差、泄漏、指标、交叉验证、实验记录与不确定性。\n- **D.4 知识与信息工程**〔D2 / D3 / D4〕：表示、组织和利用显式知识，与数据库、逻辑和AI共享方法。\n  - **D.4.1 知识表示、知识图谱与本体**〔D2 / D3 / D4〕：实体关系、本体、规则、语义约束、知识融合与图谱查询。（合并名/别名：知识与信息工程）\n  - **D.4.2 知识推理与语义计算**〔D3 / D4〕：描述逻辑、规则推理、语义互操作与神经符号结合。\n### A　人工智能与机器学习\n\n- **A.1 人工智能基础与智能系统**〔D1 / D2 / D3 / D4〕：智能体、问题求解、搜索、约束满足、规划、知识与不确定推理。（合并名/别名：人工智能、智能系统）\n  - **A.1.1 搜索、规划与约束求解**〔D1 / D2 / D3〕：启发式搜索、局部搜索、规划表示、约束传播和求解。\n  - **A.1.2 概率图模型与不确定推理**〔D2 / D3 / D4〕：Bayes网络、Markov网络、推断、学习与结构建模。\n- **A.2 机器学习**〔D1 / D2 / D3 / D4〕：从数据学习模型；统计目标、优化、泛化和部署都属于其知识范围。\n  - **A.2.1 监督、无监督与半监督学习**〔D1 / D2 / D3〕：回归/分类、聚类、降维、表示、特征工程与学习设置。\n  - **A.2.2 学习理论与泛化**〔D3 / D4〕：经验风险、PAC/VC、稳定性、偏差方差与分布外泛化。\n  - **A.2.3 深度学习**〔D2 / D3 / D4〕：神经网络、反向传播、训练、正则化和深层表示。\n    - **A.2.3.1 网络架构与表示学习**〔D2 / D3 / D4〕：MLP、卷积、循环、注意力、Transformer、图网络与自监督表征。\n    - **A.2.3.2 深度模型训练与推理系统**〔D2 / D3 / D4〕：优化器、混合精度、分布式训练、压缩、量化、蒸馏和推理服务。\n  - **A.2.4 强化学习**〔D2 / D3 / D4〕：MDP、价值/策略、时序差分、策略梯度、探索与离线学习；与控制和运筹交叉。\n  - **A.2.5 迁移、多任务与联邦学习**〔D3 / D4〕：任务迁移、协同训练、非独立同分布数据、通信与隐私约束。\n- **A.3 感知、语言与内容生成**〔D2 / D3 / D4〕：以应用问题组织的AI子领域；许多方法同时属于机器学习。\n  - **A.3.1 自然语言处理**〔D2 / D3 / D4〕：文本表示、语言建模、结构预测、信息抽取、检索与语言评测。\n  - **A.3.2 图像处理与计算机视觉**〔D2 / D3 / D4〕：滤波、变换、重建、识别、检测、分割、三维理解与视觉评估。\n  - **A.3.3 语音与音频智能**〔D2 / D3 / D4〕：语音识别、合成、声学建模、音频表征与语音交互。（合并名/别名：语音识别）\n  - **A.3.4 推荐系统**〔D2 / D3 / D4〕：召回/排序、协同过滤、上下文、反馈偏差、多目标与在线实验。\n  - **A.3.5 生成式AI**〔D2 / D3 / D4〕：自回归、潜变量、对抗与扩散模型，多模态生成、对齐与可靠评估。\n- **A.4 AI工程、可靠性与科研**〔D2 / D3 / D4〕：把模型变成可持续运行并可科学评估的系统。\n  - **A.4.1 机器学习工程与MLOps**〔D2 / D3〕：数据/模型版本、特征服务、训练管线、部署、监测与漂移。\n  - **A.4.2 可信AI、可解释性与公平性**〔D2 / D3 / D4〕：鲁棒性、校准、解释、公平、隐私和社会影响的测量与分析。\n  - **A.4.3 AI安全与模型系统安全**〔D3 / D4〕：攻击面、对抗样本、数据/模型投毒、滥用评估与模型应用防护；与网络空间安全交叉。\n  - **A.4.4 多智能体、因果与神经符号专题**〔D3 / D4〕：协作与博弈、因果表征、符号推理结合与开放研究问题。\n### S　网络空间安全\n\n- **S.1 安全基础与密码学**〔D1 / D2 / D3 / D4〕：安全目标、威胁、风险、可信边界和密码工具。\n  - **S.1.1 安全原理、威胁建模与风险**〔D1 / D2 / D3〕：机密性/完整性/可用性、认证授权、最小权限、攻击面与风险管理。\n  - **S.1.2 密码学**〔D1 / D2 / D3 / D4〕：对称/公钥、哈希、MAC、签名、密钥管理、协议与安全定义。\n  - **S.1.3 现代密码与隐私计算专题**〔D3 / D4〕：可证明安全、零知识、安全多方计算、同态加密和后量子密码。\n- **S.2 系统、网络与平台安全**〔D2 / D3 / D4〕：按被保护系统分类；系统安全和计算机系统安全合为同一入口。\n  - **S.2.1 计算机系统安全**〔D2 / D3 / D4〕：操作系统防护、内存安全、权限、隔离、可信执行、固件与系统加固。（合并名/别名：系统安全）\n  - **S.2.2 网络安全**〔D2 / D3 / D4〕：协议攻击面、分段、防火墙、入侵检测、传输保护与网络监测。\n  - **S.2.3 无线与移动安全**〔D2 / D3 / D4〕：无线协议、移动平台、设备身份、移动应用和无线威胁模型。\n  - **S.2.4 云安全与容器安全**〔D2 / D3 / D4〕：多租户、身份权限、控制平面、镜像、编排、配置与云审计。（合并名/别名：云安全）\n  - **S.2.5 硬件、嵌入式与物联网安全**〔D3 / D4〕：安全启动、调试接口、固件、设备供应链、侧信道与故障攻击。\n- **S.3 软件、应用与数据安全**〔D2 / D3 / D4〕：把安全要求贯穿设计、实现和数据生命周期。\n  - **S.3.1 应用、Web与API安全**〔D2 / D3 / D4〕：输入输出边界、认证会话、访问控制、服务端/客户端与接口安全。\n  - **S.3.2 安全软件开发与程序分析**〔D2 / D3 / D4〕：安全需求、代码审查、静态/动态分析、模糊测试与漏洞修复。\n  - **S.3.3 数据安全、隐私工程与访问控制**〔D2 / D3 / D4〕：数据分类、授权、加密、脱敏、差分隐私、审计与隐私设计。\n- **S.4 安全测试、取证与响应**〔D2 / D3 / D4〕：在授权边界内验证防护与重建事件，形成检测、响应和修复闭环。\n  - **S.4.1 渗透测试、道德黑客与反制**〔D2 / D3 / D4〕：授权测试、资产/威胁识别、验证、报告、修复与复测；合并重复课程标签。（合并名/别名：渗透测试、道德黑客与反制措施）\n  - **S.4.2 计算机取证与事件响应**〔D2 / D3 / D4〕：证据保全、磁盘/内存/网络取证、时间线、响应、恢复与复盘。（合并名/别名：计算机取证）\n  - **S.4.3 逆向工程与恶意软件分析**〔D3 / D4〕：二进制结构、行为分析、反汇编、动态观测与检测特征。\n  - **S.4.4 安全运营、检测与攻防评估**〔D2 / D3 / D4〕：日志关联、威胁情报、检测工程、演练、度量与持续改进。\n- **S.5 安全理论与研究**〔D3 / D4〕：研究安全保证、攻击模型、测量和新型计算系统的边界。\n  - **S.5.1 协议验证与信息流安全**〔D3 / D4〕：协议模型、认证性质、非干扰、形式验证和可信基。\n  - **S.5.2 系统安全研究与安全测量**〔D3 / D4〕：漏洞成因、缓解设计、可复现实验、网络测量与安全经济学。\n### H　电子硬件、嵌入式与控制\n\n- **H.1 电子与数字逻辑基础**〔D1 / D2 / D3 / D4〕：硬件方向通常还需电学、物理与实验基础；该外部前置在路线说明中列出。\n  - **H.1.1 电路与模拟电子基础**〔D1 / D2 / D3〕：电路定律、RC/RL、放大器、运放、滤波、噪声与ADC/DAC接口。（合并名/别名：模拟电子基础）\n  - **H.1.2 数字电路与数字逻辑**〔D1 / D2 / D3〕：布尔代数、组合/时序逻辑、状态机、时钟、时序与逻辑实现。\n  - **H.1.3 信号与系统、数字信号处理**〔D1 / D2 / D3 / D4〕：LTI、采样、卷积、频域、数字滤波与实现；语音/图像的传统方法共享这些基础。\n- **H.2 硬件设计与集成电路**〔D2 / D3 / D4〕：用描述语言、设计自动化和物理实现把逻辑变为电路。\n  - **H.2.1 FPGA与Verilog/HDL**〔D2 / D3 / D4〕：RTL、仿真、综合、约束、时序收敛与可编程逻辑。（合并名/别名：FPGA与Verilog、FPGA与Verilog/HDL）\n  - **H.2.2 EDA与硬件验证**〔D2 / D3 / D4〕：设计自动化、仿真、形式验证、综合、布局布线与等价性。（合并名/别名：EDA）\n  - **H.2.3 PCB设计与板级工程**〔D2 / D3〕：原理图、布局布线、供电、信号完整性、电磁兼容与制造约束。（合并名/别名：PCB设计）\n  - **H.2.4 VLSI与芯片设计**〔D2 / D3 / D4〕：CMOS数字设计、标准单元、时序/功耗/面积、物理设计与测试。（合并名/别名：VLSI）\n  - **H.2.5 半导体器件与微电子基础**〔D3 / D4〕：晶体管模型、器件物理、工艺与电路实现约束。\n- **H.3 嵌入式系统与设备接口**〔D2 / D3 / D4〕：单片机是平台之一；嵌入式还包含体系结构、驱动、实时性和系统集成。\n  - **H.3.1 单片机与微控制器**〔D2 / D3〕：GPIO、定时器、中断、外设、裸机程序、调试与资源限制。（合并名/别名：单片机）\n  - **H.3.2 嵌入式系统、驱动与RTOS**〔D2 / D3 / D4〕：启动链、驱动、实时调度、中断、资源、可靠性与硬件软件协同。（合并名/别名：嵌入式系统）\n  - **H.3.3 传感器与接口**〔D2 / D3〕：测量、校准、误差、总线、采集、执行器和软硬件接口。\n  - **H.3.4 实时系统与安全关键系统**〔D3 / D4〕：时限、调度可分析性、最坏执行时间、失效安全与验证。\n- **H.4 控制、机器人与物联网**〔D2 / D3 / D4〕：控制与物理建模属于相邻工程学科，在此保留与计算的接口。\n  - **H.4.1 控制理论与状态估计**〔D2 / D3 / D4〕：反馈、稳定性、状态空间、可控/可观、Kalman滤波与模型预测控制。\n  - **H.4.2 机器人建模、规划与控制**〔D2 / D3 / D4〕：运动学/动力学、定位建图、轨迹规划、感知融合与机器人控制。（合并名/别名：机器人控制）\n  - **H.4.3 物联网**〔D2 / D3 / D4〕：设备、连接、消息、平台、设备管理、功耗与端到端集成。\n  - **H.4.4 边缘计算**〔D2 / D3 / D4〕：把计算部署到数据源附近，研究时延、带宽、离线性、调度与资源权衡。\n### V　图形、多媒体与人机交互\n\n- **V.1 计算机图形学与媒体计算**〔D2 / D3 / D4〕：以内容的表示、合成与交互为主；与图像理解区分并建立关联。\n  - **V.1.1 计算机图形学**〔D2 / D3 / D4〕：几何表示、变换、光栅化、光照、渲染、动画与物理仿真。\n  - **V.1.2 多媒体技术**〔D2 / D3 / D4〕：图像/音频/视频表示、编码压缩、容器、同步、传输与媒体管线。\n  - **V.1.3 渲染、仿真与可微图形专题**〔D3 / D4〕：光传输、蒙特卡洛渲染、物理模拟、逆向图形与可微渲染。\n- **V.2 人机交互与用户体验**〔D1 / D2 / D3 / D4〕：人、任务、情境与界面系统的设计和评估；不是单纯界面美化。\n  - **V.2.1 交互基础与认知、人因**〔D1 / D2 / D3〕：感知、注意、心智模型、任务分析、人因与可用性原理。\n  - **V.2.2 用户研究、交互设计与UX评估**〔D2 / D3 / D4〕：访谈、原型、交互流程、可用性实验、体验评估与迭代。（合并名/别名：人机交互与用户体验）\n  - **V.2.3 可访问性与包容性设计**〔D2 / D3〕：多种能力和设备条件、辅助技术、可感知/可操作与设计评估。\n  - **V.2.4 XR、空间交互与协作系统**〔D2 / D3 / D4〕：虚实融合、追踪、空间界面、协作、沉浸与交互研究。\n- **V.3 数据可视化与可视分析**〔D1 / D2 / D3 / D4〕：用图形编码支持分析、解释与沟通；交互设计与HCI交叉。\n  - **V.3.1 数据可视化与交互设计**〔D1 / D2 / D3〕：数据类型、视觉编码、图表选择、布局、交互与读图误差。\n  - **V.3.2 科学可视化与可视分析**〔D2 / D3 / D4〕：场/体数据、时空与图可视化、多视图、人在回路分析与评估。\n### I　信息系统、组织与专业实践\n\n- **I.1 信息系统与业务**〔D1 / D2 / D3〕：信息系统包含技术、流程、人员与组织，不等同于程序开发。\n  - **I.1.1 信息系统基础**〔D1 / D2〕：系统构成、组织角色、数据/流程/决策与企业应用。\n  - **I.1.2 信息系统战略与管理**〔D2 / D3〕：IT治理、业务对齐、投资组合、采购、服务与组织变革。\n  - **I.1.3 业务流程管理**〔D2 / D3〕：流程发现、建模、分析、执行、自动化与持续改进。\n  - **I.1.4 信息技术项目管理**〔D2 / D3〕：范围、进度、资源、成本、风险、沟通、质量和利益相关者。\n- **I.2 专业伦理、治理与科研方法**〔D1 / D2 / D3 / D4〕：连接技术实践与社会责任，科研方法贯穿所有专业方向。\n  - **I.2.1 计算伦理、社会影响与专业责任**〔D1 / D2 / D3 / D4〕：隐私、知识产权、偏见、可持续性、责任与公共利益；具体法规依地区和时间核验。\n  - **I.2.2 技术写作、协作与文献阅读**〔D1 / D2 / D3 / D4〕：技术表达、审查、检索、批判阅读、研究问题与团队沟通。\n  - **I.2.3 研究设计、可复现性与学术规范**〔D2 / D3 / D4〕：假设、基线、实验设计、误差与效度、复现、数据/代码和学术诚信。\n### X　交叉应用与前沿专题\n\n- **X.1 智能设备与自主系统**〔D2 / D3 / D4〕：把AI、嵌入式、系统与控制结合为物理智能系统。\n  - **X.1.1 嵌入式AI**〔D2 / D3 / D4〕：资源受限设备上的推理、感知、压缩和硬件协同；与边缘AI相交。\n  - **X.1.2 边缘AI**〔D2 / D3 / D4〕：边缘部署的学习/推理、端边云协同、时延/功耗与隐私权衡。\n  - **X.1.3 自动驾驶与自主系统**〔D2 / D3 / D4〕：感知、定位、预测、规划、控制、实时与安全评估；同时需要领域工程基础。（合并名/别名：自动驾驶）\n- **X.2 科学与行业计算**〔D2 / D3 / D4〕：行业知识决定问题、约束与评估；领域应用不代表学术难度较低。\n  - **X.2.1 生物信息与计算生物学**〔D2 / D3 / D4〕：序列/组学、结构、统计推断和生物数据；外部前置为分子生物学。（合并名/别名：生物信息）\n  - **X.2.2 金融科技与计算金融**〔D2 / D3 / D4〕：支付与金融系统、量化建模、风控、隐私与系统工程；外部前置为金融经济知识。（合并名/别名：金融科技）\n  - **X.2.3 教育科技与学习科学计算**〔D2 / D3 / D4〕：学习平台、学习分析、智能辅导、测量与教学效果评估；外部前置为教育/心理/测量。（合并名/别名：教育科技）\n  - **X.2.4 医疗健康信息学**〔D2 / D3 / D4〕：临床数据、医疗信息系统、决策支持和评价；外部前置为医学与临床流程。\n  - **X.2.5 地理空间、气候与数字人文计算**〔D2 / D3 / D4〕：时空、地球系统、文献与文化数据计算；分别需要地学或人文学科知识。\n- **X.3 新型计算与可信协作**〔D2 / D3 / D4〕：包含计算范式与跨系统协作专题；不能只以通用学习优先级判断价值。\n  - **X.3.1 量子计算与量子信息**〔D3 / D4〕：量子态、门与测量、量子算法、纠错和量子信息；外部前置为量子力学基础。（合并名/别名：量子计算）\n  - **X.3.2 区块链与分布式账本**〔D2 / D3 / D4〕：密码承诺、共识、账本、智能合约和机制；是分布式/密码/经济机制交叉。（合并名/别名：区块链）\n  - **X.3.3 科学机器学习与可微仿真**〔D3 / D4〕：物理约束学习、神经算子、反问题、可微求解与科学验证。\n\n## 典型学习路线\n\n以下顺序是建议，箭头概括整条路线；精确概念依赖以逐条关系列表为准。\n\n### 先建立公共骨架\n\nP.1.1 程序设计基础 → M.5.3 证明方法与离散结构 → M.3.1 线性代数 → M.1 分析与微积分 → F.1 数据结构与算法 → C.1 计算机组成与体系结构 → C.2.1 操作系统 → C.3.2 网络协议、路由与传输 → D.1.1 数据建模、关系模型与SQL → P.4.1 软件工程基础与开发方法\n\n这些是可交错推进的基础模块。微积分主要支撑连续建模路线，离散算法和Web可提前实践；不要求先学完全部数学。\n\n### AI与数据路线\n\nM.3.1 线性代数 → M.1.4 多元微积分 → M.6.1 概率论 → M.6.2 数理统计 → M.7 优化与运筹 → P.2.3 Python与科学计算工具 → A.2 机器学习 → D.3.3 评估、实验与可复现分析 → A.4.1 机器学习工程与MLOps\n\n从小基线开始，把统计、优化与模型工程交替推进；实分析、测度、泛函仅在理论目标需要时深入。\n\n### 系统与安全路线\n\nP.2.2 C/C++与底层编程 → C.1 计算机组成与体系结构 → C.2 操作系统与系统软件 → C.3 数据通信与计算机网络 → C.4 分布式系统与云计算 → S.1.1 安全原理、威胁建模与风险 → S.2 系统、网络与平台安全 → S.3 软件、应用与数据安全 → S.4 安全测试、取证与响应\n\n安全研究建立在被保护系统的正常工作机制上；密码理论路线另需概率、代数和复杂性。\n\n### 硬件与嵌入式路线\n\nH.1.1 电路与模拟电子基础 → H.1.2 数字电路与数字逻辑 → P.2.2 C/C++与底层编程 → C.1.1 计算机组成原理 → H.3.1 单片机与微控制器 → H.3.2 嵌入式系统、驱动与RTOS → H.3.3 传感器与接口 → H.4 控制、机器人与物联网\n\n补足电学与物理实验。FPGA/VLSI是可分叉路线；机器人另补力学，控制另补微分方程与线性系统。\n\n### 软件与产品路线\n\nP.1 程序设计基础与范式 → F.1 数据结构与算法 → P.2.4 版本控制、调试与构建工具 → P.4 软件工程与软件架构 → D.1 数据库系统与数据管理 → C.3.2 网络协议、路由与传输 → P.5 应用开发与软件交付 → V.2 人机交互与用户体验 → I.1.4 信息技术项目管理\n\n把需求、设计、测试、可访问性、安全与运维放进同一个小项目；不以学完高阶数学为启动条件。\n\n### 理论与科研路线\n\nM.5 离散数学与逻辑基础 → F.2 自动机、计算与复杂性 → F.3 程序语言理论与形式化方法 → M.1.6 实分析 → M.6.2.4 高维统计与统计学习理论 → I.2.2 技术写作、协作与文献阅读 → I.2.3 研究设计、可复现性与学术规范\n\n按方向选择理论：算法重离散与复杂性，学习理论重概率统计与优化，连续科学计算重分析与数值。\n\n## 关键跨领域辨析\n\n- 多元微积分包含多元微分、重积分和曲线曲面积分；梯度、Jacobian、Hessian是其中工具，不与整门微积分并列计为独立基础学科。\n- 矩阵论与矩阵分析合为一个交叠课程入口；基础矩阵内容仍从属于线性代数，高阶矩阵专题在该入口展开。\n- 计算数学覆盖数值分析，并包含随机与符号计算；本图合并导航入口但没有把两者定义为完全同义。\n- 数理统计包含贝叶斯统计；随机过程包含Markov链；Monte Carlo是跨概率、计算和统计的计算方法，统一归M.8.4。\n- AI包含机器学习，机器学习包含深度学习；强化学习也可采用非深度方法。NLP、视觉、语音、推荐是问题领域，和深度学习交叉而不全被其包含。\n- 软件工程原理、实践与原则、开发方法学合并主入口；需求、设计、架构、测试和运维分别展开。架构与设计有交界，不是按难度拆开的学科。\n- 数据库系统是数据管理领域的核心；数据库管理与安全是其中运营主题，与安全域的数据安全相交。数据科学不等于AI，也包括统计、管线、可视化和科学评估。\n- 系统安全与计算机系统安全合并；网络空间安全是上位入口，网络安全、系统安全、应用安全等是不同对象下的分支。\n- 计算机组成关注实现部件，体系结构关注接口与权衡；ARM是具体ISA体系。单片机是嵌入式平台之一，FPGA、EDA、PCB与VLSI不是彼此同义的课程。\n- 嵌入式AI强调设备约束，边缘AI强调计算位置；二者相交。物联网强调设备互联，边缘计算强调部署策略。\n- 图形学生成图像，计算机视觉解释图像；二者通过几何、渲染和逆问题连接。HCI研究人与系统，数据可视化研究数据的视觉表达与探索。\n\n## 前置依赖与交叉关联（完整关系表）\n\n包含边由目录父子关系给出；下表列出人为筛选的主要非树关系。未画出一条边不代表不存在联系。\n\n| 类型 | 起点 | 终点 | 解释 |\n|---|---|---|---|\n| 前置 → | M.1.1 极限与连续 | M.1.2 一元微分学 | 极限与连续支撑导数定义及相关定理。 |\n| 前置 → | M.1.2 一元微分学 | M.1.3 一元积分学 | 导数与原函数连接积分计算和微积分基本定理。 |\n| 前置 → | M.1.2 一元微分学 | M.1.4.1 多元微分学 | 从一元变化率推广到多元导数。 |\n| 前置 → | M.3.1 线性代数 | M.1.4.2 梯度与雅可比矩阵 | 线性映 关系的亮度。\n8. “文字框架”提供可展开树；“原清单核对”和“图例与说明”可直接阅读。支持键盘操作、下载完整数据、文字框架、完整星图SVG与打印目录。\n9. “跨学科桥梁”可一键高亮线代×概率统计×AI、系统×安全、控制×强化学习、教育科技×统计交互、图形学×视觉等真实关系。每组保留具体主题、方向、关系类型和解释，不把上位学科粗略当成一门先修课。\n10. 全景中的星区桥梁由具体跨域关系汇总，并显示数量；选中一个大分支时，也会列出其子项通向其他领域的联系。线代与统计即使同属数学星区，它们之间的具体连线仍保留。\n\n## 范围与参考\n\n本图以用户清单为覆盖基准，并参考下列权威目录核对缺口。知识的主归属、D1–D4标记、前置建议和解释由本图组织，不是上述机构公布的唯一课程标准。数学各分支可独立发展；领域与课程边界允许交叠。研究专题为代表性入口，无法穷尽所有分支。\n\n- [ACM / IEEE-CS / AAAI：CS2023知识领域](https://csed.acm.org/knowledge-areas/)：核对计算机科学主干的覆盖范围；本图的分组与深度不是CS2023官方编码。\n- [IEEE Computer Society：SWEBOK知识体系](https://www.computer.org/education/bodies-of-knowledge/software-engineering)：核对需求、设计、架构、测试、运营与软件安全等工程边界。\n- [AMS / zbMATH：MSC2020数学主题分类](https://mathscinet.ams.org/mathscinet/msc/msc2020.html)：核对数学分支的广度；本图不是MSC分类表的逐项翻译。\n\n编制日期：2026-10-31。原清单可追踪覆盖；阶段不代表固定年级、绝对难度或学习优先级。\n";

function showModal(type){const titles={bridges:'跨学科桥梁 · 查看具体主题之间的联系',help:'知识星图 · 图例与使用方法',outline:'可展开文字框架',coverage:'原清单逐项核对',routes:'学习路线 · 在星图中沿途探索',progress:'学习记录与备份',sources:'范围、参考与组织原则'};$('#modalTitle').textContent=titles[type]||'';let c='';if(type==='bridges')c=bridgeModalHTML();if(type==='help')c=`<h3>一张完整的大图</h3><p>${DATA.nodes.length}个知识节点共处一张画布，按11个主干领域聚成星区。它们的位置始终固定；点击领域、搜索或下一步指引，只会移动视角和突出关系。全景中的小点就是细分主题，放大后逐渐出现名称；把鼠标移到星点上也能看到全名。</p><h3>包含与前置有向，交叉关联无向</h3><p><span class="stroke"></span> <b>包含 A → B</b>：A组织或包含B。<br><span class="stroke pre"></span> <b>前置 A → B</b>：建议学习B时具备A的相关基础。并非所有路线的硬性先修。<br><span class="stroke rel"></span> <b>交叉 A — B</b>：共享方法、范围相交或相互应用，没有强制先后。<br>全景中连线较淡；放大后或选中节点时，箭头和直接关系会清晰显示。勾选“增强连线”可提高全图亮度；未画线不等于没有联系。</p><p>点击顶部“跨学科桥梁”，可一键突出线代—统计—AI等主题关系。全景中的星区间连线由真实主题关系汇总；点击大分支还能按另一个领域展开其全部跨域联系。空间距离仅服务排布，不代表难度或精确相似度。</p><h3>两个编码独立使用</h3><p><b>M.1.4.2</b> 表示数学 → 分析与微积分 → 多元微积分 → 梯度与雅可比矩阵。点号数量表示知识归属层级。<br><b>D1–D4</b> 表示学习深度，不决定知识属于哪个领域，也不是绝对难度或优先级。</p><table><tr><th>编码</th><th>阶段</th><th>典型验收</th></tr>${Object.entries(DATA.depths).map(([k,v])=>`<tr><td>D${k}</td><td>${E(v.name)}</td><td>${E(v.goal)}</td></tr>`).join('')}</table><h3>像科技树一样，点出下一步</h3><p>点击星点，右侧显示建议前置、子分支、后续方向与跨领域应用。点任意建议，视角会飞向那个节点，整张星图继续保留。可按D阶段标记掌握情况，优先推荐尚未记录的分支；不强制锁定主题，点击查看也不会自动视为学会。</p><h3>操作</h3><p>拖拽平移；滚轮以指针为中心缩放；双击放大；手机支持双指缩放。<br>左下小地图可点击或拖动定位；“全图”返回完整视野，“定位”回到当前主题。<br>左侧深度筛选只改变高亮，其他节点留在原位。<br>键盘：方向键平移，<span class="kbd">＋ / −</span>缩放，<span class="kbd">Home</span>返回全图。星图取得焦点后，用<span class="kbd">Tab</span>循环节点，<span class="kbd">Enter</span>打开指引，<span class="kbd">Esc</span>收起详情。可展开文字框架也支持键盘访问。</p><p class="modal-note">X星区保留教育科技、金融科技、生物信息等按目标选学方向，不另设“第五层”。通用学习路线中可以后置，不表示这些方向简单或价值低。</p><div class="download-row"><button class="btn" data-modal="outline">打开文字框架</button><button class="btn" data-modal="coverage">核对原清单</button><button class="btn" data-modal="progress">学习记录</button><button class="btn" data-action="download-svg">导出完整星图SVG</button></div>`;

canvas.addEventListener('keydown',e=>{const moves={ArrowLeft:[90,0],ArrowRight:[-90,0],ArrowUp:[0,90],ArrowDown:[0,-90]};if(moves[e.key]){e.preventDefault();if(animation)cancelAnimationFrame(animation);const[dx,dy]=moves[e.key];state.tx+=dx;state.ty+=dy;requestDraw()}else if(['+','=','-','_','Home','Enter','Escape','Tab'].includes(e.key)){e.preventDefault();if(e.key==='Home')fitAll();else if(e.key==='+'||e.key==='=')zoomAt(1.3);else if(e.key==='-'||e.key==='_')zoomAt(1/1.3);else if(e.key==='Escape'){openInspector('ROOT');canvas.blur()}else if(e.key==='Tab'){keyboardIndex=(keyboardIndex+(e.shiftKey?-1:1)+DATA.nodes.length)%DATA.nodes.length;const n=DATA.nodes[keyboardIndex];state.hover=n.id;focusNode(n.id);$('#keyboardStatus').textContent=n.name+'，按Enter查看学习指引。'}else if(e.key==='Enter'&&state.hover)navigate(state.hover)}});
function miniMove(e){if(!miniTransform)return;const r=mini.getBoundingClientRect(),p={x:(e.clientX-r.left-miniTransform.ox)/miniTransform.z,y:(e.clientY-r.top-miniTransform.oy)/miniTransform.z},a=availableRect();moveCamera(a.x+a.w/2-p.x*state.zoom,a.y+a.h/2-p.y*state.zoom,state.zoom,false)}let miniDrag=false;mini.addEventListener('pointerdown',e=>{miniDrag=true;mini.setPointerCapture(e.pointerId);miniMove(e)});mini.addEventListener('pointermove',e=>{if(miniDrag)miniMove(e)});mini.addEventListener('pointerup',()=>miniDrag=false);mini.addEventListener('pointercancel',()=>miniDrag=false);
$('#importProgress').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('文件过大');const x=JSON.parse(await file.text());if(x.format!=='cs-math-progress-v1'||!x.progress||typeof x.progress!=='object'||Array.isArray(x.progress))throw Error('记录格式不匹配');let count=0;for(const[k,v]of Object.entries(x.progress)){const[id,d]=k.split('@');if(v===true&&by[id]&&id!=='ROOT'&&by[id].levels.includes(+d)&&/^[A-Z](?:\.\d+)*@[1-4]$/.test(k)){if(!progress[k])count++;progress[k]=true}}saveProgress();render();showModal('progress');toast('已合并 '+count+' 项新记录。')}catch(err){toast('无法导入：'+err.message)}finally{e.target.value=''}});
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const old={w:state.width,h:state.height};resize();state.tx+=(state.width-old.w)/2;state.ty+=(state.height-old.h)/2;requestDraw()},100)});document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));window.addEventListener('beforeprint',()=>{if(!$('#printArea').innerHTML){const make=id=>{const n=by[id];return`<li><b>${E(n.id+' '+n.name)}</b>〔${n.levels.map(d=>'D'+d).join('/')}〕<p>${E(n.desc)}</p>${n.children.length?'<ul>'+n.children.map(make).join('')+'</ul>':''}</li>`};$('#printArea').innerHTML='<h1>计算机科学与数学知识地图</h1><ul>'+ROOT.children.map(make).join('')+'</ul>'}});
renderDomains();updateNav();resize();render();fitAll(false);
window.knowledgeMap={data:DATA,navigate,showModal,getState:()=>({selected:state.selected,domain:state.domain,view:'star',goal:state.goal,zoom:state.zoom,tx:state.tx,ty:state.ty,nodes:state.positions.size,edges:visualEdges.filter(e=>state.types.has(e.type)).length,progress:{...progress},bridge:state.bridge?.title||null,highlightedEdges:state.bridge?.edges.length||0,matches:DATA.nodes.filter(matches).map(n=>n.id),neighbors:[...state.neighbors],detailOpen:state.detailOpen,route:[...state.route]}),getNodePoint:id=>{const p=state.positions.get(id);if(!p)return null;const s=screen(p),r=canvas.getBoundingClientRect();return{x:s.x+r.left,y:s.y+r.top}},fitAll};

</script></body></html>
